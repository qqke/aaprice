name: Send price alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert worker
        env:
          FUNCTION_URL: ${{ secrets.PRICE_ALERT_FUNCTION_URL }}
          CRON_SECRET: ${{ secrets.PRICE_ALERT_CRON_SECRET }}
        run: |
          if [ -z "$FUNCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Price alert secrets are not configured; skipping this run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$FUNCTION_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
