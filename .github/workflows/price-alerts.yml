name: Send price alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: price-alerts-production
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger alert worker
        env:
          FUNCTION_URL: https://tplkpguxlvrhxassyjfm.supabase.co/functions/v1/send-price-alerts
          CRON_SECRET: ${{ secrets.PRICE_ALERT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::PRICE_ALERT_CRON_SECRET is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$FUNCTION_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
