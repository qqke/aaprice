name: Deploy Supabase functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: tplkpguxlvrhxassyjfm
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Validate deployment secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
      - name: Deploy price alert worker
        run: supabase functions deploy send-price-alerts --project-ref "$PROJECT_ID" --use-api
      - name: Deploy account deletion worker
        run: supabase functions deploy delete-account --project-ref "$PROJECT_ID" --use-api
      - name: Verify worker and cron secret
        run: |
          function_url="https://${PROJECT_ID}.supabase.co/functions/v1/send-price-alerts"
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" "$function_url")
          if [ "$status" != "401" ]; then
            echo "::error::Expected the deployed worker to reject an unauthenticated request with 401, received $status"
            cat response.json
            exit 1
          fi
      - name: Verify account deletion authentication
        run: |
          function_url="https://${PROJECT_ID}.supabase.co/functions/v1/delete-account"
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" --request POST "$function_url" --header "Content-Type: application/json" --data '{"confirmation":"DELETE"}')
          if [ "$status" != "401" ]; then
            echo "::error::Expected account deletion worker to reject an unauthenticated request with 401, received $status"
            cat response.json
            exit 1
          fi
