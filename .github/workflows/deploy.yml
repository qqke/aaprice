name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and upload
        uses: withastro/action@v6
        with:
          build-cmd: npm test && npm run build
        env:
          ASTRO_BASE_PATH: /
          PUBLIC_SITE_URL: https://prices.stbf.online
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_DISABLE_TURNSTILE: ${{ vars.PUBLIC_DISABLE_TURNSTILE || '1' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify custom domain assets
        run: node scripts/verify-production-site.mjs https://prices.stbf.online/
